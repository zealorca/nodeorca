<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>我喜欢钓鱼</title>
  <style>
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      background: linear-gradient(180deg, #cfe9f5, #f7fbfd);
      color: #1f2d3d;
    }
    header {
      background: linear-gradient(135deg, #1e88a8, #4fc3dc);
      color: white;
      padding: 60px 20px;
      text-align: center;
    }
    header h1 {
      margin: 0 0 10px;
      font-size: 2.5rem;
      letter-spacing: 2px;
    }
    header p {
      margin: 0;
      font-size: 1.1rem;
      opacity: 0.95;
    }
    .container {
      max-width: 900px;
      margin: 40px auto;
      padding: 0 20px;
    }
    section {
      background: white;
      border-radius: 14px;
      padding: 30px;
      margin-bottom: 30px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.08);
    }
    section h2 {
      margin-top: 0;
      color: #1e88a8;
    }
    .reasons ul {
      padding-left: 20px;
    }
    .reasons li {
      margin: 10px 0;
      line-height: 1.6;
    }
    .quote {
      font-style: italic;
      background: #f1f8fb;
      border-left: 4px solid #4fc3dc;
      padding: 15px 20px;
    }
    footer {
      text-align: center;
      padding: 30px 10px;
      color: #607d8b;
      font-size: 0.9rem;
    }
    .emoji {
      font-size: 1.3rem;
    }
  </style>
</head>
<body>
  <header>
    <h1>🎣 我喜欢钓鱼</h1>
    <p>在水边，时间会慢下来</p>
  </header>

  <main class="container">
    <section>
      <h2>为什么喜欢钓鱼</h2>
      <p>
        钓鱼不只是为了鱼本身，更是一种与自然相处的方式。找一片安静的水域，
        抛竿、等待、观察水面的微小变化，整个人都会慢慢安静下来。
      </p>
    </section>

    <section class="reasons">
      <h2>钓鱼带来的快乐</h2>
      <ul>
        <li>🌊 靠近自然，听风声、水声，远离城市的喧嚣</li>
        <li>🧘 放空大脑，享受专注与等待的过程</li>
        <li>🐟 中鱼的一瞬间，紧张又兴奋</li>
        <li>☀️ 清晨或傍晚的水面，总有意想不到的美</li>
      </ul>
    </section>

    <section>
      <h2>一句话总结</h2>
      <div class="quote">
        “钓鱼教会我的，不是如何抓住，而是如何等待。”
      </div>
    </section>
  </main>

  <footer>
    <p>Made with ❤️ & 🎣 | 一个简单的静态网页</p>
  </footer>
</body>
</html>
